name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright E2E (live API)
    runs-on: ubuntu-latest
    # The homepage/event specs hit the real Smarkets API (this project's
    # philosophy throughout: verify against the live API, don't mock it).
    # A live-API hiccup or an outbound-network restriction on the runner
    # shouldn't fail the required "verify" gate above, so this job reports
    # but doesn't block. The login spec mocks its route handler and doesn't
    # touch the real, rate-limited (5 req/300s) sessions endpoint.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
